title: "七十感言 — 马克·吐温"

tts:
  provider: qwen
  model: qwen-audio-3.1-tts-flash
  region: cn-beijing
  format: mp3
  sample_rate: 24000

output_dir: output/mark-twain/seventy-years

characters:
  narrator:
    name: Mark Twain
    voice: longlaotie_v3.1 

segments:
  # 第一幕：七十岁，终于有资格说教了
  - id: opening-01
    speaker: narrator
    emotion: surprised
    rate: 0.95
    text: "七十岁了！"
    pause_after: 0.8

  - id: opening-02
    speaker: narrator
    emotion: authoritative
    rate: 0.92
    text: "走到生命的这个时刻，你就赢得了一种全新而令人敬畏的尊严。"
    pause_after: 0.5

  - id: opening-03
    speaker: narrator
    emotion: playful
    rate: 0.96
    text: "这时候，你可以抛开那些折磨了你一辈子的体面克制，无惧无畏地站在生命七层阶梯的巅峰，居高临下，指点江山，却不受呵斥。"
    pause_after: 0.8

  - id: opening-04
    speaker: narrator
    emotion: cheerful
    rate: 0.98
    text: "你可以向世界讲述你的经历。大家都爱这么做。"
    pause_after: 0.5

  - id: opening-05
    speaker: narrator
    emotion: playful
    rate: 0.95
    text: "你永远也不会厌倦告诉别人，自己靠着怎样的精心安排和严格自律，才攀上了这一绝顶。"
    pause_after: 0.6

  - id: opening-06
    speaker: narrator
    emotion: neutral 
    rate: 0.92
    text: "你会详解自己的生命历程，带着老年的欣喜，细细品味其中的每一个细节。"
    pause_after: 0.6

  - id: opening-07
    speaker: narrator
    emotion: excited
    rate: 1.0
    text: "我早已迫不及待地想向大家讲述自己这漫长的一路。"
    pause_after: 0.5

  - id: opening-08
    speaker: narrator
    emotion: playful
    rate: 0.92
    text: "现在，我终于有资格了。"
    pause_after: 1.0

  # 第二幕：长寿秘诀
  - id: longevity-01
    speaker: narrator
    emotion: neutral 
    rate: 0.94
    text: "我这七十年过得没什么不寻常。严格遵守生命规律，最终也将和所有人一样，走向死亡。"
    pause_after: 0.8

  - id: longevity-02
    speaker: narrator
    emotion: sarcastic
    rate: 0.94
    text: "听起来有些夸张，但这确实是活到高龄的一般规律。"
    pause_after: 0.7

  - id: longevity-03
    speaker: narrator
    emotion: neutral 
    rate: 0.94
    text: "研究任意一位唠叨老人的起居日程，我们就会发现，那些让他们延年益寿的习惯，用在我们身上，却有可能加速衰老。"
    pause_after: 0.6

  - id: longevity-04
    speaker: narrator
    emotion: playful
    rate: 0.94
    text: "继承产业可以供养他们安享晚年，正如乔特先生所言，却只怕会让我们提前报废。"
    pause_after: 0.8

  - id: longevity-05
    speaker: narrator
    emotion: authoritative
    rate: 0.9
    text: "在此，我想送你们一条精彩箴言。"
    pause_after: 0.8

  - id: longevity-06
    speaker: narrator
    emotion: resolute
    rate: 0.88
    text: "走别人的路，活不长久。"
    pause_after: 1.2

  - id: longevity-07
    speaker: narrator
    emotion: playful
    rate: 0.96
    text: "如果有人想学习我七十年来躲避医生和刽子手的经验，借此自行了断，我很乐于把我的生命之道教给他。"
    pause_after: 0.7

  - id: longevity-08
    speaker: narrator
    emotion: serious
    rate: 0.94
    text: "某些细节听来可能不真实，可它们千真万确。"
    pause_after: 0.5

  - id: longevity-09
    speaker: narrator
    emotion: playful
    rate: 0.92
    text: "我来这里是为了传道，可不是来骗人的。"
    pause_after: 1.0

  # 第三幕：所谓规律的作息
  - id: routine-01
    speaker: narrator
    emotion: neutral 
    rate: 0.94
    text: "人到四十岁，才会形成长期的习惯。"
    pause_after: 0.5

  - id: routine-02
    speaker: narrator
    emotion: sarcastic
    rate: 0.94
    text: "然后，它们开始僵化。到了现在，已经石化了。于是，生意来了。"
    pause_after: 0.9

  - id: routine-03
    speaker: narrator
    emotion: serious
    rate: 0.94
    text: "从四十岁开始，我的作息就很有规律。这相当重要。"
    pause_after: 0.6

  - id: routine-04
    speaker: narrator
    emotion: neutral 
    rate: 0.95
    text: "我有一条规矩：等到没人做伴时，就上床躺着。"
    pause_after: 0.6

  - id: routine-05
    speaker: narrator
    emotion: playful
    rate: 0.94
    text: "另一条规矩是：等到不得不起床时，才起床。"
    pause_after: 0.9

  - id: routine-06
    speaker: narrator
    emotion: cheerful
    rate: 0.95
    text: "就这样，我在不规律中，达到了不可动摇的规律。"
    pause_after: 0.9

  - id: routine-07
    speaker: narrator
    emotion: sarcastic
    rate: 0.92
    text: "它让我活得很好，但有害他人。"
    pause_after: 1.1

  # 第四幕：饮食的艺术
  - id: diet-01
    speaker: narrator
    emotion: serious
    rate: 0.94
    text: "关于饮食，这也很重要。"
    pause_after: 0.4

  - id: diet-02
    speaker: narrator
    emotion: playful
    rate: 0.96
    text: "我坚持不懈地吃不适合我的食物，不到和它们斗个你死我活，绝不罢休。"
    pause_after: 0.8

  - id: diet-03
    speaker: narrator
    emotion: cheerful
    rate: 0.94
    text: "直到最近，我才取得胜利。"
    pause_after: 0.6

  - id: diet-04
    speaker: narrator
    emotion: melancholy
    rate: 0.94
    text: "但去年春天，我还是放弃了半夜享用肉馅饼的习惯。在那之前，我一直认为它不会造成负担。"
    pause_after: 0.8

  - id: diet-05
    speaker: narrator
    emotion: neutral 
    rate: 0.94
    text: "三十年里，我一直坚持早上八点喝咖啡、吃面包，之后就不吃不喝，直到夜里七点半才进食。中间间隔十一个小时。"
    pause_after: 0.7

  - id: diet-06
    speaker: narrator
    emotion: serious
    rate: 0.94
    text: "对我来说，这没问题，而且有益健康，因为我这辈子都没头痛过。"
    pause_after: 0.6

  - id: diet-07
    speaker: narrator
    emotion: neutral 
    rate: 0.94
    text: "但如果有头痛病的人也学我这样做，只怕没法安安稳稳活到七十岁。"
    pause_after: 0.6

  - id: diet-08
    speaker: narrator
    emotion: sarcastic
    rate: 0.92
    text: "想尝试的话，简直再傻不过。"
    pause_after: 0.9

  - id: diet-09
    speaker: narrator
    emotion: serious
    rate: 0.94
    text: "我还想提醒你们，如果发觉只有走一条让自己不舒服的路，才能活到七十岁，那就别走这条路。"
    pause_after: 0.7

  - id: diet-10
    speaker: narrator
    emotion: resolute
    rate: 0.92
    text: "这真的是诤诤良言。"
    pause_after: 0.8

  - id: diet-11
    speaker: narrator
    emotion: playful
    rate: 0.94
    text: "如果他们开走了卧铺，却把你留在臭烘烘的吸烟车厢，那就收拾好行李，结好账。"
    pause_after: 0.6

  - id: diet-12
    speaker: narrator
    emotion: cheerful
    rate: 0.96
    text: "一到有公墓的车站，就赶紧下车吧！"
    pause_after: 1.1

  # 第五幕：六十年的吸烟生涯
  - id: smoking-01
    speaker: narrator
    emotion: serious
    rate: 0.94
    text: "我的规矩还有一条：一次只抽一支烟。"
    pause_after: 0.6

  - id: smoking-02
    speaker: narrator
    emotion: playful
    rate: 0.95
    text: "关于抽烟，我没有更多限制。"
    pause_after: 0.7

  - id: smoking-03
    speaker: narrator
    emotion: neutral 
    rate: 0.94
    text: "我已经不记得抽烟始于何时，只知道那时我父亲还在世，所以必须得偷偷摸摸。"
    pause_after: 0.7

  - id: smoking-04
    speaker: narrator
    emotion: melancholy
    rate: 0.94
    text: "一八四七年，他早早离世，那时我才刚满十一岁。"
    pause_after: 0.6

  - id: smoking-05
    speaker: narrator
    emotion: cheerful
    rate: 0.95
    text: "从那以后，我就公开抽烟了。"
    pause_after: 0.7

  - id: smoking-06
    speaker: narrator
    emotion: playful
    rate: 0.94
    text: "我自己不加节制，但作为别人的楷模，始终严守睡眠中决不抽烟的规矩。"
    pause_after: 0.6

  - id: smoking-07
    speaker: narrator
    emotion: sarcastic
    rate: 0.94
    text: "只是醒来以后，也不会戒烟。"
    pause_after: 0.9

  - id: smoking-08
    speaker: narrator
    emotion: neutral 
    rate: 0.94
    text: "这条规矩很好，当然，只是对我而言。你们也很清楚，它不能保证每个人都活到七十岁。"
    pause_after: 0.9

  - id: smoking-09
    speaker: narrator
    emotion: playful
    rate: 0.95
    text: "入睡前，我在床上抽烟。夜里会醒来一两次，有时三次。我从不浪费这些抽烟的机会。"
    pause_after: 0.8

  - id: smoking-10
    speaker: narrator
    emotion: tender
    rate: 0.93
    text: "这个习惯对我而言熟悉亲切，弥足珍贵。如果失去它，我的感受就像先生您——我说的是主席失去自己的唯一美德，如果您有的话。"
    pause_after: 0.9

  - id: smoking-11
    speaker: narrator
    emotion: playful
    rate: 0.92
    text: "我并没有指责您。"
    pause_after: 0.8

  - id: smoking-12
    speaker: narrator
    emotion: neutral 
    rate: 0.94
    text: "我得承认，有过一段长达数月的日子，我曾断断续续戒烟。"
    pause_after: 0.6

  - id: smoking-13
    speaker: narrator
    emotion: sarcastic
    rate: 0.94
    text: "但那不是因为自律，而是做做样子。"
    pause_after: 0.6

  - id: smoking-14
    speaker: narrator
    emotion: playful
    rate: 0.94
    text: "只是为了粉碎那些批评——他们说我是习惯的奴隶，无力打破自己的镣铐。"
    pause_after: 1.0

  # 第六幕：烟草经济学
  - id: tobacco-01
    speaker: narrator
    emotion: cheerful
    rate: 0.96
    text: "今天，也是我开始尽情抽烟六十周年的日子。"
    pause_after: 0.6

  - id: tobacco-02
    speaker: narrator
    emotion: serious
    rate: 0.94
    text: "我从不买带过滤嘴的烟。很早我就意识到，它们对我来说太贵了。"
    pause_after: 0.6

  - id: tobacco-03
    speaker: narrator
    emotion: playful
    rate: 0.95
    text: "我总是买便宜烟，至少是价格比较合理的。"
    pause_after: 0.7

  - id: tobacco-04
    speaker: narrator
    emotion: neutral 
    rate: 0.94
    text: "六十年前，我买的是四块钱一筒的烟。后来，品位有所提升，现在已经买七块钱的了。"
    pause_after: 0.8

  - id: tobacco-05
    speaker: narrator
    emotion: curious
    rate: 0.94
    text: "六块还是七块来着？"
    pause_after: 0.7

  - id: tobacco-06
    speaker: narrator
    emotion: cheerful
    rate: 0.96
    text: "七块吧。是的，七块钱。"
    pause_after: 0.5

  - id: tobacco-07
    speaker: narrator
    emotion: playful
    rate: 0.94
    text: "但这是含烟筒的价格。"
    pause_after: 0.9

  - id: tobacco-08
    speaker: narrator
    emotion: cheerful
    rate: 0.96
    text: "我常常在家里开吞云吐雾的聚会，可来客都声称已经戒烟。"
    pause_after: 1.0

  - id: tobacco-09
    speaker: narrator
    emotion: sarcastic
    rate: 0.92
    text: "也不知道为什么。"
    pause_after: 1.1

  # 第七幕：饮酒与个体差异
  - id: drinking-01
    speaker: narrator
    emotion: serious
    rate: 0.94
    text: "对于饮酒，我没有规矩。"
    pause_after: 0.5

  - id: drinking-02
    speaker: narrator
    emotion: cheerful
    rate: 0.96
    text: "别人饮酒时，我乐于相助；别人不喝，我也不沾。"
    pause_after: 0.6

  - id: drinking-03
    speaker: narrator
    emotion: neutral 
    rate: 0.94
    text: "习惯如此，偏好如此。"
    pause_after: 0.7

  - id: drinking-04
    speaker: narrator
    emotion: serious
    rate: 0.94
    text: "不喝酒伤不到我，但很可能伤到你，因为你和我不一样。"
    pause_after: 0.7

  - id: drinking-05
    speaker: narrator
    emotion: playful
    rate: 0.92
    text: "那你就不必操心了。"
    pause_after: 1.0

  # 第八幕：鱼肝油与童年往事
  - id: medicine-01
    speaker: narrator
    emotion: neutral 
    rate: 0.94
    text: "七岁以后，我就极少吃药，现在的需要就更少了。"
    pause_after: 0.6

  - id: medicine-02
    speaker: narrator
    emotion: playful
    rate: 0.94
    text: "但七岁之前，我几乎靠对抗疗法药物活着。"
    pause_after: 0.7

  - id: medicine-03
    speaker: narrator
    emotion: sarcastic
    rate: 0.94
    text: "不是因为我需要，我认为不是，只是为了省钱。"
    pause_after: 0.7

  - id: medicine-04
    speaker: narrator
    emotion: cheerful
    rate: 0.95
    text: "我父亲接手了一家药房，所以比起其他早餐食品，鱼肝油更为便宜。"
    pause_after: 0.6

  - id: medicine-05
    speaker: narrator
    emotion: surprised
    rate: 0.96
    text: "我们家有九桶鱼肝油，一直支撑我活到七岁。"
    pause_after: 0.9

  - id: medicine-06
    speaker: narrator
    emotion: playful
    rate: 0.95
    text: "其后，我就断油了。"
    pause_after: 0.8

  - id: medicine-07
    speaker: narrator
    emotion: neutral 
    rate: 0.94
    text: "家里其他人只能和大黄、吐根等东西做伴，因为我是最受宠的一个。"
    pause_after: 0.7

  - id: medicine-08
    speaker: narrator
    emotion: cheerful
    rate: 0.95
    text: "我堪称首个标准鱼肝油信赖者。"
    pause_after: 0.6

  - id: medicine-09
    speaker: narrator
    emotion: playful
    rate: 0.94
    text: "我把它们全吃了。"
    pause_after: 0.8

  - id: medicine-10
    speaker: narrator
    emotion: cheerful
    rate: 0.95
    text: "等到药房倒闭，我已茁壮成长。从此，少有健康上的烦扰。"
    pause_after: 0.7

  - id: medicine-11
    speaker: narrator
    emotion: serious
    rate: 0.94
    text: "但你们也很清楚，为了让普通孩子活到七十岁而效仿我，实在愚蠢至极。"
    pause_after: 0.7

  - id: medicine-12
    speaker: narrator
    emotion: sarcastic
    rate: 0.94
    text: "这方法正好对我奏效，纯属偶然。"
    pause_after: 0.7

  - id: medicine-13
    speaker: narrator
    emotion: playful
    rate: 0.92
    text: "一百年内，都不会再有。"
    pause_after: 1.1

  # 第九幕：拒绝锻炼
  - id: exercise-01
    speaker: narrator
    emotion: serious
    rate: 0.94
    text: "睡觉和休息之余，我从不锻炼，也从不打算锻炼。"
    pause_after: 0.7

  - id: exercise-02
    speaker: narrator
    emotion: annoyed
    rate: 0.94
    text: "锻炼实在可憎。"
    pause_after: 0.8

  - id: exercise-03
    speaker: narrator
    emotion: sarcastic
    rate: 0.94
    text: "累了的时候，它对你没任何好处。"
    pause_after: 0.6

  - id: exercise-04
    speaker: narrator
    emotion: playful
    rate: 0.92
    text: "而我累了。"
    pause_after: 0.9

  - id: exercise-05
    speaker: narrator
    emotion: sarcastic
    rate: 0.94
    text: "不过，让别人学样的话，你就等着看他的结局吧。"
    pause_after: 1.1

  # 第十幕：重申箴言
  - id: ending-01
    speaker: narrator
    emotion: serious
    rate: 0.92
    text: "现在，我想重申并强调我的箴言。"
    pause_after: 0.8

  - id: ending-02
    speaker: narrator
    emotion: resolute
    rate: 0.88
    text: "走别人的路，活不长久。"
    pause_after: 1.0

  - id: ending-03
    speaker: narrator
    emotion: neutral 
    rate: 0.92
    text: "我的生活习惯护佑了我的生命。"
    pause_after: 0.8

  - id: ending-04
    speaker: narrator
    emotion: sarcastic
    rate: 0.90
    text: "但它可能置你于死地。"
    pause_after: 1.5