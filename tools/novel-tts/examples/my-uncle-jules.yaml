title: My Uncle Jules - Full Story

tts:
  provider: qwen
  model: qwen-audio-3.1-tts-flash
  region: cn-beijing
  format: mp3
  sample_rate: 24000

output_dir: output/my-uncle-jules

characters:
  narrator:
    name: Narrator
    voice: wenhuaizhi_v3.1
  joseph:
    name: Joseph Davranche
    voice: longanyang_v3.1
  philip:
    name: Philip (Father)
    voice: longsanshu_v3.1
  clarisse:
    name: Clarisse (Mother)
    voice: longanhuan_v3.1 
  jules:
    name: Uncle Jules
    voice: longsanshu_v3.1
  captain:
    name: Captain
    voice: libai_v3.1

segments:
  # ===== 序幕：遇见乞讨的老乞丐 =====
  - id: opening-meet-beggar
    speaker: narrator
    emotion: serious
    rate: 0.95
    text: "有一天，我们碰见一个白胡子穷老头在向人乞讨，和我同行的朋友约瑟夫·达弗朗什竟给了他一个五法郎的银币，我见此大感诧异，于是，他便向我解释说："
    pause_after: 0.6

  - id: joseph-intro-story
    speaker: joseph
    emotion: nostalgic
    rate: 0.95
    text: "这个可怜的老头，使我想起了一件往事，这些年来，它一直叫我念念难忘，我且说给你听听吧。"
    pause_after: 0.8

  # ===== 第一部分：拮据的家境 =====
  - id: narrator-family-background
    speaker: narrator
    emotion: somber
    rate: 0.95
    text: "我家原籍勒阿弗尔，家境不富裕，紧巴巴地过着小日子。我父亲有一份差事，每天上班要忙到老晚才能回家，但挣钱不多。家里人口不少，在我上头，还有两个姐姐。"
    pause_after: 0.5

  - id: narrator-mother-complains
    speaker: narrator
    emotion: serious
    rate: 0.95
    text: "我母亲对这种拮据的生活深感不满，她经常冲着自己的丈夫讲些尖酸刻薄的话，含沙射影、恶毒阴损地进行责难。碰到这种情况，我可怜的父亲总有一个习惯的动作，张开手掌去摸摸额头，似乎要抹去一滴其实并不存在的汗水，嘴里说不出一句话来。每当见他这样，我就感到心酸，我觉得他有一种无可奈何的痛苦。"
    pause_after: 0.5

  - id: narrator-thrift-details
    speaker: narrator
    emotion: neutral
    rate: 0.95
    text: "在我们家，处处都得精打细算，力求节俭；有人请吃饭，我们从不敢答应，以免回请。家里的吃穿用，买的都是便宜货，商店里的清仓品。两个姐姐穿的礼服，得由她们自己去做，为了在十五生丁一米的饰带上省点钱，两人要商量好半天。每天，全家老是吃肥油汤与仅仅调料有所变换的牛肉，据说，这么吃既卫生又有营养，可我还是宁愿吃点别的什么。"
    pause_after: 0.4

  - id: narrator-clothes-scolding
    speaker: narrator
    emotion: subdued
    rate: 0.95
    text: "我衣服上的纽扣弄掉了，裤子撕破了，那都要挨一顿痛骂。"
    pause_after: 0.5

  # ===== 第二部分：星期天的防波堤散步 =====
  - id: narrator-sunday-walk
    speaker: narrator
    emotion: nostalgic
    rate: 0.95
    text: "但是，每逢星期天，我们全家都要衣冠楚楚到防波堤上去散步。我父亲身穿礼服，头顶礼帽，戴着手套，用胳膊挽着我母亲，母亲也打扮得五彩缤纷，就像节日里挂满了彩旗的轮船。两个姐姐早早装扮妥善，只等出发的一声令下；可是每到最后一分钟，总能在一家之主的礼服上发现一个忘了擦去的污渍，于是，就得赶快用一块旧布蘸上汽油去把它擦掉。"
    pause_after: 0.5

  - id: narrator-cleaning-father
    speaker: narrator
    emotion: neutral
    rate: 0.95
    text: "在对父亲进行这番清理时，他头上仍然顶着礼帽，两只袖管褪下，露出背心，呆立在那里，等待清理完毕，而我母亲则戴上近视眼镜，把手套脱下，以免弄脏。"
    pause_after: 0.5

  - id: narrator-grand-procession
    speaker: narrator
    emotion: serious
    rate: 0.95
    text: "之后，全家隆重上路了。两个姐姐手挽着手，走在前头。她们都已经到了出嫁的年龄，所以双亲大人总喜欢让她们在全城人面前显摆显摆。我走在母亲的左边，父亲则在她右边。我至今还记得我父母亲在此种星期天例行散步中的庄严神态，他们一本正经，举止凝重，腰板笔挺，双腿绷直，如此这般跨步前进，似乎他们的仪态绝非小节，而是关系到某种宏图大业。"
    pause_after: 0.6

  - id: narrator-watch-ships
    speaker: narrator
    emotion: expectant
    rate: 0.95
    text: "每个星期天，只要看见从远方陌生国度驶回的巨轮进港，我父亲总要一字不差地发出同样的感叹："
    pause_after: 0.4

  - id: philip-sigh-jules
    speaker: philip
    emotion: longing
    rate: 0.9
    text: "唉，要是于勒在这条船上，那该叫人多么惊喜呀！"
    pause_after: 0.8

  # ===== 第三部分：于勒叔叔的过往 =====
  - id: narrator-who-is-jules
    speaker: narrator
    emotion: neutral
    rate: 0.95
    text: "我父亲有一个弟弟，即我的叔叔于勒，从前他是全家的祸害，后来则成为了全家唯一的指望。我从小就听家里的人谈论他，对他非常熟悉，我觉得只要一见面也许就能认出他来。他动身去美洲之前的生活底细，我全都听说过，尽管家人在谈起他那一段生活时，总是压低了声音。"
    pause_after: 0.5

  - id: narrator-typical-spendthrift
    speaker: narrator
    emotion: serious
    rate: 0.95
    text: "据说，他以前不务正业，也就是说，挥霍过一些钱财，这对穷人家庭来说，要算是莫大的罪过，但对有钱人家而言，吃喝玩乐只不过是糊涂、没脑子而已，旁人顶多笑称他为花花公子。若是生活困苦人家的一个孩子，逼得自己的父母耗尽了家里的储蓄，那简直就是一个坏蛋、一个无赖、一个流氓了！"
    pause_after: 0.5

  - id: narrator-morality-note
    speaker: narrator
    emotion: thoughtful
    rate: 0.95
    text: "虽然，同是败家行径，但有差异，理应有所区分才是，因一个行为的善恶是非，要视其后果影响而定。"
    pause_after: 0.5

  - id: narrator-jules-depleted-inheritance
    speaker: narrator
    emotion: somber
    rate: 0.95
    text: "总之，于勒叔叔把自己应得的那份遗产败得精光后，还将我父亲所指望的那一部分侵蚀掉不少。"
    pause_after: 0.5

  - id: narrator-sent-to-america
    speaker: narrator
    emotion: neutral
    rate: 0.95
    text: "按当时的惯例，他被送上一艘从勒阿弗尔驶向纽约的商船，被打发到美洲去了。"
    pause_after: 0.6

  # ===== 第四部分：两封来信与全家希望 =====
  - id: narrator-first-letter
    speaker: narrator
    emotion: hopeful
    rate: 0.95
    text: "一到美洲，我的这位于勒叔叔就做起了说不清的什么买卖，不久，他写信回家说他已经赚了点钱，并希望补偿我父亲因他而受的损失。这封信使得全家人激动万分。于勒，过去被大家认为一文不值的于勒，如今摇身一变，成为了一个正直的人，有良心的人，一个达弗朗什家合格的成员，跟达弗朗什家任何人一样，诚实正派。"
    pause_after: 0.5

  - id: narrator-captain-rumor
    speaker: narrator
    emotion: neutral
    rate: 0.95
    text: "此外，我们还从一个船长那里得知，于勒盘下了一个大铺面，做起了大生意。"
    pause_after: 0.6

  - id: narrator-second-letter-intro
    speaker: narrator
    emotion: serious
    rate: 0.95
    text: "两年以后，我们又收到了第二封信，信上说："
    pause_after: 0.4

  - id: jules-second-letter
    speaker: jules
    emotion: earnest
    rate: 0.95
    text: "我亲爱的菲利普，此信为报平安，以免兄为小弟的健康担心。我一切皆好。弟明日即去南美洲作长期旅行，兄或许好几年难得弟的音讯，如弟未能及时通报，我兄不必多虑。一旦弟事业有成，即将返回故里，但愿为期不久，你我兄弟届时欢聚一堂。"
    pause_after: 0.8

  - id: narrator-gospel-letter
    speaker: narrator
    emotion: warm
    rate: 0.95
    text: "他这封信成了家里的福音书，一有机会，我们就拿出来念念，碰见熟人，就拿出来展示展示。"
    pause_after: 0.5

  - id: narrator-ten-years-wait
    speaker: narrator
    emotion: expectant
    rate: 0.95
    text: "果然，十年之内，于勒叔叔再没有来过信，但随着岁月流逝，我父亲的期望却与日俱增，我母亲也常这么说："
    pause_after: 0.4

  - id: clarisse-good-jules
    speaker: clarisse
    emotion: hopeful
    dialect: chongqing
    rate: 0.95
    text: "等我们的好于勒回来了，家里就会富裕的，总算这一家子出了一个能人！"
    pause_after: 0.7

  - id: narrator-repeat-sigh
    speaker: narrator
    emotion: nostalgic
    rate: 0.95
    text: "从此，每个星期日，我父亲望见从天边驶近的巨轮，在天空中留下长龙般的黑烟时，总要重复他那句老话："
    pause_after: 0.4

  - id: philip-sigh-again
    speaker: philip
    emotion: longing
    rate: 0.9
    text: "唉，要是于勒就在这条船上，那该多好！"
    pause_after: 0.6

  - id: narrator-imagine-jules-wave
    speaker: narrator
    emotion: dreamy
    rate: 0.95
    text: "而当此时，我们也都似乎看见于勒在船上挥动着手帕，朝我们喊道："
    pause_after: 0.4

  - id: jules-wave-call
    speaker: jules
    emotion: cheerful
    rate: 1.0
    text: "喂，菲利普！"
    pause_after: 0.7

  - id: narrator-plans-villa
    speaker: narrator
    emotion: hopeful
    rate: 0.95
    text: "他必将满载而归，我们对此做了种种规划，甚至打算用于勒叔叔的钱，在安古维勒附近的乡村购置一所别墅，我猜想我父亲很可能已就此进行过洽谈。"
    pause_after: 0.5

  # ===== 第五部分：二姐求婚与泽西岛之旅 =====
  - id: narrator-sisters-age
    speaker: narrator
    emotion: subdued
    rate: 0.95
    text: "我大姐已经二十八岁了，二姐只小两岁，两人都在等着出嫁，这是全家的一大愁事。"
    pause_after: 0.5

  - id: narrator-suitor-proposes
    speaker: narrator
    emotion: neutral
    rate: 0.95
    text: "终于有人来向二姐求婚了。他是个公务员，并不富有，但正派体面。我总觉得，这个青年人之所以终于下定决心向我二姐求婚，是因为有一天晚上，我们给他看了于勒叔叔的那封信。"
    pause_after: 0.5

  - id: narrator-accept-and-trip
    speaker: narrator
    emotion: hopeful
    rate: 0.95
    text: "我们家赶紧答应了他的求婚，并且决定，婚礼后，全家到泽西岛去作一次旅游。"
    pause_after: 0.6

  - id: narrator-jersey-intro
    speaker: narrator
    emotion: neutral
    rate: 0.95
    text: "泽西岛是穷人旅游的理想去处。它并不远，坐小轮船渡海即可到达。小岛属于英国人，到了那里，就算出国到了异邦。也就是说，一个法国人，只要坐上两个钟头的船，就可以将邻国风光尽收眼底，还可以置身其中研究研究那个飘着英国旗的小岛上的风俗民情。不过，据那些直言不讳的人说，岛上的民风实在是没法恭维。"
    pause_after: 0.5

  - id: narrator-only-dream
    speaker: narrator
    emotion: earnest
    rate: 0.95
    text: "到泽西岛去旅行，成为了我们全家唯一的期望，无时无刻不在的梦想，成为了我们朝思暮想的大事。"
    pause_after: 0.6

  # ===== 第六部分：登船出海 =====
  - id: narrator-departure-day
    speaker: narrator
    emotion: vivid
    rate: 0.95
    text: "盼来盼去，总算盼到了出发的一天。今天我回想当时的情形，就像昨天刚发生过的事。轮船在格朗维尔码头生火待发。父亲心神不定，慌乱失措，紧张地盯着我们将三个包袱带上船，母亲则不安地紧抓着我未婚大姐的胳臂。自从二姐出嫁后，大姐就像鸡窝里剩下的一只小鸡，形孤影单，似乎有点丧魂落魄了；在我们身后，是新婚夫妇，他们总是落在后面，使得我不时回头去看看。"
    pause_after: 0.5

  - id: narrator-ship-departs
    speaker: narrator
    emotion: elated
    rate: 0.95
    text: "轮船拉响了汽笛。我们都已经上了船。这时轮船离开堤坝，向海洋远处驶去，风平浪静，海面像绿色大理石一般平整。我们看着海岸迅速朝后退离，莫不洋洋得意，神采飞扬，就像很少出门旅行的人那样。"
    pause_after: 0.6

  - id: narrator-father-gasoline
    speaker: narrator
    emotion: nostalgic
    rate: 0.95
    text: "我父亲在礼服下挺着他的大肚子，礼服上原有的污渍，当天早上经过家里人的仔细擦拭，都清除掉了。此刻，他随身发散着出门的日子惯常有的汽油味，每逢我闻到这股气味，就知道是星期天了。"
    pause_after: 0.6

  # ===== 第七部分：船上吃牡蛎 =====
  - id: narrator-oyster-scene
    speaker: narrator
    emotion: descriptive
    rate: 0.95
    text: "突然，他看见两位先生在请两位漂亮的太太吃牡蛎。一个衣衫褴褛的老水手用小刀把牡蛎一一剖开，递给两位先生，再由他们转手给两位太太。太太们享用的姿势很优雅。先用一块精美的手帕将牡蛎托起，再将嘴微微前伸，以免弄脏自己的衣裙。接着，嘴唇又轻又快地一吮，把鲜液吸得精光，然后将空壳扔进海里。"
    pause_after: 0.5

  - id: narrator-father-wooed
    speaker: narrator
    emotion: expectant
    rate: 0.95
    text: "我父亲显然被如此雅致的景象所打动，在行驶着的海船上吃牡蛎！何其高尚文雅，多么风光有派！于是，他走到我母亲与两个姐姐身边，问道："
    pause_after: 0.4

  - id: philip-offer-oysters
    speaker: philip
    emotion: eager
    rate: 0.95
    text: "我请你们吃牡蛎，怎么样？"
    pause_after: 0.6

  - id: narrator-mother-hesitates
    speaker: narrator
    emotion: neutral
    rate: 0.95
    text: "母亲舍不得花钱，甚为犹豫，但两个姐姐立即就同意了，母亲怏怏不乐地说："
    pause_after: 0.4

  - id: clarisse-refusal
    speaker: clarisse
    emotion: reluctant
    dialect: chongqing
    rate: 0.95
    text: "我怕吃了胃不舒服，只给孩子们买点吧，但别吃太多，吃多了会生病。"
    pause_after: 0.4

  - id: clarisse-joseph-skip
    speaker: clarisse
    emotion: dismissive
    dialect: chongqing
    rate: 0.95
    text: "约瑟夫嘛，就不必吃了，别把男孩子惯坏了。"
    pause_after: 0.6

  - id: narrator-joseph-left-behind
    speaker: narrator
    emotion: aggrieved
    rate: 0.95
    text: "于是，我就只好留在母亲身边，对她此种区别对待甚忿忿不平。我盯着父亲，见他郑重其事地领着两位千金和那乘龙快婿，朝那个衣衫褴褛的老水手走去。"
    pause_after: 0.5

  - id: narrator-father-demonstrates
    speaker: narrator
    emotion: humorous
    rate: 0.95
    text: "那两位太太刚好离开，我父亲就向我两个姐姐讲解如何吃牡蛎才能不流失掉鲜汁。他拿过来一只，要给她们做示范动作。他试着模仿那两位太太时，不意把牡蛎的汁液全滴在了他的礼服上，于是我听见我母亲咕哝了一句："
    pause_after: 0.4

  - id: clarisse-mutter
    speaker: clarisse
    emotion: exasperated
    dialect: chongqing
    rate: 0.95
    text: "他还是老老实实待着为妙。"
    pause_after: 0.7

  # ===== 第八部分：发现卖牡蛎的就是于勒 =====
  - id: narrator-father-alarmed
    speaker: narrator
    emotion: tense
    rate: 0.9
    text: "但是，父亲突然显得不安起来。他从那儿退离了几步，眼睛盯着拥挤在卖牡蛎老头周围的女儿女婿，然后，骤然朝我和母亲走来。他脸色煞白，目光也很古怪。他小声对我母亲说："
    pause_after: 0.4

  - id: philip-whisper-resemblance
    speaker: philip
    emotion: uneasy
    rate: 0.85
    text: "天大的怪事，那个卖牡蛎的人怎么这样像于勒呀。"
    pause_after: 0.6

  - id: narrator-mother-stunned
    speaker: narrator
    emotion: tense
    rate: 0.95
    text: "母亲愣住了，她问："
    pause_after: 0.3

  - id: clarisse-which-jules
    speaker: clarisse
    emotion: confused
    dialect: chongqing
    rate: 0.9
    text: "哪个于勒？"
    pause_after: 0.5

  - id: narrator-father-answer
    speaker: narrator
    emotion: tense
    rate: 0.95
    text: "父亲回答："
    pause_after: 0.3

  - id: philip-not-sure
    speaker: philip
    emotion: shaky
    rate: 0.85
    text: "就是……我的弟弟……若不是我知道他眼下正在美洲春风得意，我险些真以为是他。"
    pause_after: 0.6

  - id: narrator-mother-panic
    speaker: narrator
    emotion: alarmed
    rate: 0.95
    text: "母亲也慌了起来，结结巴巴地说："
    pause_after: 0.3

  - id: clarisse-deny
    speaker: clarisse
    emotion: agitated
    dialect: chongqing
    rate: 0.95
    text: "你真疯了！明明知道那不是他，干吗还说这些蠢话？"
    pause_after: 0.5

  - id: narrator-father-insists
    speaker: narrator
    emotion: anxious
    rate: 0.95
    text: "但父亲还钻牛角尖，说："
    pause_after: 0.3

  - id: philip-go-look-her-self
    speaker: philip
    emotion: uneasy
    rate: 0.9
    text: "你还是去看看吧，克拉丽丝，眼见为实，最好你自己去看个究竟。"
    pause_after: 0.6

  - id: narrator-mother-goes-verify
    speaker: narrator
    emotion: tense
    rate: 0.95
